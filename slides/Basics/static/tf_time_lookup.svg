<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D355F"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
  </defs>
  <style>
    .code { font-family: 'Source Code Pro', monospace; font-size: 12px; font-weight: bold; fill: #0D355F; }
    .s { font-size: 11px; fill: #333; }
    .sr { font-size: 11px; fill: #C2232B; }
    .sg { font-size: 11px; fill: #666; }
    .lane { stroke: #CCC; stroke-width: 1; }
    .tick { stroke: #0D355F; stroke-width: 2.5; }
    .tickp { stroke: #C2232B; stroke-width: 3; }
    .static { stroke: #0D355F; stroke-width: 6; stroke-opacity: 0.25; }
    .ax { stroke: #0D355F; stroke-width: 1.6; fill: none; }
  </style>
  <text x="10" y="46" class="code">world → base_link</text>
  <text x="10" y="62" class="code">world → camera</text>
  <text x="10" y="111" class="code">base_link → gripper_tcp</text>
  <text x="10" y="127" class="s">joints, e.g. 100 Hz</text>
  <text x="10" y="176" class="code">camera → object</text>
  <text x="10" y="192" class="s">perception, irregular</text>
  <line x1="260" y1="50" x2="960" y2="50" class="lane"/>
  <line x1="260" y1="115" x2="960" y2="115" class="lane"/>
  <line x1="260" y1="180" x2="960" y2="180" class="lane"/>
  <line x1="260" y1="50" x2="960" y2="50" class="static"/>
  <line x1="275" y1="40" x2="275" y2="60" class="tick"/>
  <text x="285" y="40" class="sg">/tf_static: published once, valid at any time</text>
  <line x1="275" y1="105" x2="275" y2="125" class="tick"/>
  <line x1="305" y1="105" x2="305" y2="125" class="tick"/>
  <line x1="335" y1="105" x2="335" y2="125" class="tick"/>
  <line x1="365" y1="105" x2="365" y2="125" class="tick"/>
  <line x1="395" y1="105" x2="395" y2="125" class="tick"/>
  <line x1="425" y1="105" x2="425" y2="125" class="tick"/>
  <line x1="455" y1="105" x2="455" y2="125" class="tick"/>
  <line x1="485" y1="105" x2="485" y2="125" class="tick"/>
  <line x1="515" y1="105" x2="515" y2="125" class="tick"/>
  <line x1="545" y1="105" x2="545" y2="125" class="tick"/>
  <line x1="575" y1="105" x2="575" y2="125" class="tick"/>
  <line x1="605" y1="105" x2="605" y2="125" class="tick"/>
  <line x1="635" y1="105" x2="635" y2="125" class="tick"/>
  <line x1="665" y1="105" x2="665" y2="125" class="tick"/>
  <line x1="695" y1="105" x2="695" y2="125" class="tick"/>
  <line x1="725" y1="105" x2="725" y2="125" class="tick"/>
  <line x1="755" y1="105" x2="755" y2="125" class="tick"/>
  <line x1="785" y1="105" x2="785" y2="125" class="tick"/>
  <line x1="815" y1="105" x2="815" y2="125" class="tick"/>
  <line x1="845" y1="105" x2="845" y2="125" class="tick"/>
  <line x1="875" y1="105" x2="875" y2="125" class="tick"/>
  <line x1="905" y1="105" x2="905" y2="125" class="tick"/>
  <line x1="395" y1="168" x2="395" y2="192" class="tickp"/>
  <line x1="600" y1="168" x2="600" y2="192" class="tickp"/>
  <circle cx="700" cy="180" r="5" fill="#FFF" stroke="#777" stroke-width="1.5"/>
  <path d="M694,186 C670,205 630,205 606,190" class="ax" style="stroke:#777" marker-end="url(#g)"/>
  <text x="712" y="178" class="sg">published at 2.45 s,</text>
  <text x="712" y="193" class="sg">stamped 2.30 s</text>
  <line x1="260" y1="230" x2="985" y2="230" class="ax" marker-end="url(#a)"/>
  <text x="980" y="250" class="s" text-anchor="end">time</text>
  <line x1="600" y1="28" x2="600" y2="230" stroke="#C2232B" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="600" y="250" class="sr" text-anchor="middle" style="font-weight:bold">t_image = 2.30 s</text>
  <text x="600" y="266" class="sr" text-anchor="middle">lookup at the image stamp: consistent</text>
  <rect x="588" y="100" width="44" height="30" rx="4" fill="none" stroke="#C2232B" stroke-width="1.5"/>
  <text x="638" y="98" class="sr">interpolated between 2 samples</text>
  <line x1="905" y1="28" x2="905" y2="230" stroke="#777" stroke-width="1.8" stroke-dasharray="2 4"/>
  <text x="905" y="250" class="sg" text-anchor="middle" style="font-weight:bold">now</text>
  <text x="990" y="266" class="sg" text-anchor="end">object from 2.30 s + TCP from now:</text>
  <text x="990" y="282" class="sg" text-anchor="end">wrong if the arm moved</text>
</svg>
