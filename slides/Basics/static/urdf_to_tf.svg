<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D355F"/>
    </marker>
  </defs>
  <style>
    .box { fill: #E8EEF5; stroke: #0D355F; stroke-width: 1.5; }
    .ext { fill: #F4F4F4; stroke: #777; stroke-width: 1.2; }
    .topic { fill: #FFFFFF; stroke: #0D355F; stroke-width: 1.3; stroke-dasharray: 5 3; }
    .tc { font-size: 13px; font-weight: bold; fill: #0D355F; text-anchor: middle; }
    .sc { font-size: 10.5px; fill: #333; text-anchor: middle; }
    .lbl { font-size: 10.5px; fill: #555; }
    .code { font-family: 'Source Code Pro', monospace; font-size: 12px; fill: #C2232B; text-anchor: middle; }
    .ln { stroke: #0D355F; stroke-width: 1.4; fill: none; }
  </style>

  <!-- inputs -->
  <rect x="15" y="30" width="230" height="64" rx="6" class="box"/>
  <text x="130" y="55" class="tc">URDF / xacro</text>
  <text x="130" y="74" class="sc">links, joints, origins</text>
  <text x="130" y="87" class="sc">(the kinematic structure)</text>

  <rect x="15" y="156" width="230" height="64" rx="6" class="ext"/>
  <text x="130" y="181" class="code">/joint_states</text>
  <text x="130" y="200" class="sc">joint_state_broadcaster (robot)</text>
  <text x="130" y="213" class="sc">or joint_state_publisher_gui</text>

  <line x1="245" y1="62" x2="338" y2="112" class="ln" marker-end="url(#a)"/>
  <text x="262" y="72" class="lbl">robot_description</text>
  <text x="262" y="85" class="lbl">parameter</text>
  <line x1="245" y1="188" x2="338" y2="140" class="ln" marker-end="url(#a)"/>
  <text x="262" y="188" class="lbl">current joint</text>
  <text x="262" y="201" class="lbl">positions</text>

  <!-- robot_state_publisher -->
  <rect x="340" y="95" width="220" height="62" rx="8" fill="#FDF6E3" stroke="#0D355F" stroke-width="2"/>
  <text x="450" y="122" class="tc">robot_state_publisher</text>
  <text x="450" y="141" class="sc">forward kinematics (KDL)</text>

  <!-- outputs -->
  <line x1="560" y1="110" x2="648" y2="45"  class="ln" marker-end="url(#a)"/>
  <line x1="560" y1="126" x2="648" y2="126" class="ln" marker-end="url(#a)"/>
  <line x1="560" y1="142" x2="648" y2="207" class="ln" marker-end="url(#a)"/>

  <rect x="650" y="20" width="170" height="50" rx="14" class="topic"/>
  <text x="735" y="42" class="code">/tf_static</text>
  <text x="735" y="60" class="sc">fixed joints</text>
  <rect x="650" y="101" width="170" height="50" rx="14" class="topic"/>
  <text x="735" y="123" class="code">/tf</text>
  <text x="735" y="141" class="sc">moving joints</text>
  <rect x="650" y="182" width="170" height="50" rx="14" class="topic"/>
  <text x="735" y="204" class="code">/robot_description</text>
  <text x="735" y="222" class="sc">the URDF, for other nodes</text>

  <line x1="820" y1="45"  x2="878" y2="105" class="ln" marker-end="url(#a)"/>
  <line x1="820" y1="126" x2="878" y2="126" class="ln" marker-end="url(#a)"/>
  <line x1="820" y1="207" x2="878" y2="147" class="ln" marker-end="url(#a)"/>
  <rect x="880" y="90" width="110" height="72" rx="6" class="ext"/>
  <text x="935" y="118" class="tc">RViz</text>
  <text x="935" y="136" class="sc">RobotModel:</text>
  <text x="935" y="150" class="sc">meshes at the TFs</text>
</svg>
