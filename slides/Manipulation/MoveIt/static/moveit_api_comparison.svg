<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D355F"/>
    </marker>
  </defs>
  <style>
    .proc { fill: #FDF6E3; stroke: #0D355F; stroke-width: 2; }
    .box { fill: #E8EEF5; stroke: #0D355F; stroke-width: 1.3; }
    .api { fill: #fff; stroke: #C2232B; stroke-width: 1.8; }
    .ext { fill: #F4F4F4; stroke: #777; stroke-width: 1.2; }
    .h { font-size: 16px; font-weight: bold; fill: #0D355F; text-anchor: middle; }
    .t { font-size: 13px; font-weight: bold; fill: #0D355F; text-anchor: middle; }
    .s { font-size: 11px; fill: #333; text-anchor: middle; }
    .lbl { font-size: 11px; fill: #C2232B; }
    .ln { stroke: #0D355F; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Left: MoveGroupInterface -->
  <text x="250" y="22" class="h">MoveGroupInterface: client / server</text>
  <rect x="30" y="38" width="440" height="88" rx="8" class="proc"/>
  <text x="250" y="57" class="t">Your node (process 1, C++)</text>
  <rect x="50" y="68" width="190" height="44" rx="5" class="api"/>
  <text x="145" y="95" class="t">MoveGroupInterface</text>
  <rect x="260" y="68" width="190" height="44" rx="5" class="api"/>
  <text x="355" y="95" class="t">PlanningSceneInterface</text>

  <line x1="250" y1="128" x2="250" y2="170" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="262" y="154" class="lbl">ROS 2 actions · services · topics</text>

  <rect x="30" y="172" width="440" height="100" rx="8" class="proc"/>
  <text x="250" y="191" class="t">move_group (process 2)</text>
  <rect x="45" y="203" width="130" height="56" rx="5" class="box"/>
  <text x="110" y="227" class="s">Planning</text>
  <text x="110" y="242" class="s">pipelines</text>
  <rect x="185" y="203" width="130" height="56" rx="5" class="box"/>
  <text x="250" y="227" class="s">Planning Scene</text>
  <text x="250" y="242" class="s">Monitor</text>
  <rect x="325" y="203" width="130" height="56" rx="5" class="box"/>
  <text x="390" y="227" class="s">Trajectory</text>
  <text x="390" y="242" class="s">Execution Mgr</text>

  <line x1="250" y1="272" x2="250" y2="312" class="ln" marker-end="url(#a)"/>
  <rect x="130" y="314" width="240" height="40" rx="6" class="ext"/>
  <text x="250" y="339" class="t">ros2_control</text>

  <line x1="500" y1="10" x2="500" y2="360" stroke="#bbb" stroke-dasharray="4 4"/>

  <!-- Right: MoveItPy -->
  <text x="750" y="22" class="h">MoveItPy: in-process</text>
  <rect x="530" y="38" width="440" height="234" rx="8" class="proc"/>
  <text x="750" y="57" class="t">Your node (one process, Python)</text>
  <rect x="550" y="68" width="400" height="38" rx="5" class="api"/>
  <text x="750" y="92" class="t">MoveItPy · PlanningComponent (Python bindings)</text>
  <line x1="750" y1="106" x2="750" y2="122" class="ln" marker-end="url(#a)"/>
  <rect x="550" y="124" width="400" height="38" rx="5" class="box"/>
  <text x="750" y="148" class="t">MoveItCpp (C++ core, same code as move_group)</text>
  <rect x="545" y="203" width="130" height="56" rx="5" class="box"/>
  <text x="610" y="227" class="s">Planning</text>
  <text x="610" y="242" class="s">pipelines</text>
  <rect x="685" y="203" width="130" height="56" rx="5" class="box"/>
  <text x="750" y="227" class="s">Planning Scene</text>
  <text x="750" y="242" class="s">Monitor</text>
  <rect x="825" y="203" width="130" height="56" rx="5" class="box"/>
  <text x="890" y="227" class="s">Trajectory</text>
  <text x="890" y="242" class="s">Execution Mgr</text>
  <line x1="610" y1="162" x2="610" y2="201" class="ln" marker-end="url(#a)"/>
  <line x1="750" y1="162" x2="750" y2="201" class="ln" marker-end="url(#a)"/>
  <line x1="890" y1="162" x2="890" y2="201" class="ln" marker-end="url(#a)"/>
  <text x="762" y="186" class="lbl">function calls, no ROS hop</text>

  <line x1="750" y1="272" x2="750" y2="312" class="ln" marker-end="url(#a)"/>
  <rect x="630" y="314" width="240" height="40" rx="6" class="ext"/>
  <text x="750" y="339" class="t">ros2_control</text>
</svg>
