<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D355F"/>
    </marker>
  </defs>
  <style>
    .box { fill: #E8EEF5; stroke: #0D355F; stroke-width: 1.5; }
    .own { fill: #FFFFFF; stroke: #0D355F; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .ext { fill: #F4F4F4; stroke: #777; stroke-width: 1.2; }
    .t { font-size: 12.5px; font-weight: bold; fill: #0D355F; }
    .tc { font-size: 13px; font-weight: bold; fill: #0D355F; text-anchor: middle; }
    .tag { font-size: 10px; fill: #777; }
    .s { font-size: 11px; fill: #333; }
    .sc { font-size: 11px; fill: #333; text-anchor: middle; }
    .code { font-family: 'Source Code Pro', monospace; font-size: 10.5px; fill: #C2232B; }
    .ln { stroke: #0D355F; stroke-width: 1.3; fill: none; }
  </style>

  <!-- Inputs: vendor and shared packages -->
  <text x="150" y="16" class="sc">read-only: apt or pinned in dependencies.repos</text>

  <rect x="10" y="26" width="280" height="48" rx="6" class="box"/>
  <text x="20" y="45" class="t">ur_description</text>
  <text x="280" y="45" class="tag" text-anchor="end">apt · vendor</text>
  <text x="20" y="63" class="code">ur_macro.xacro → xacro:ur_robot</text>

  <rect x="10" y="82" width="280" height="48" rx="6" class="box"/>
  <text x="20" y="101" class="t">schunk_gripper_description</text>
  <text x="280" y="101" class="tag" text-anchor="end">git · shared</text>
  <text x="20" y="119" class="code">egu_50_gripper_jaws_macro.xacro</text>

  <rect x="10" y="138" width="280" height="48" rx="6" class="box"/>
  <text x="20" y="157" class="t">realsense2_description</text>
  <text x="280" y="157" class="tag" text-anchor="end">apt · vendor</text>
  <text x="20" y="175" class="code">_d435i_imu_modules.urdf.xacro</text>

  <rect x="10" y="194" width="280" height="48" rx="6" class="box"/>
  <text x="20" y="213" class="t">example_table_description</text>
  <text x="280" y="213" class="tag" text-anchor="end">git · shared</text>
  <text x="20" y="231" class="code">xacro:example_table</text>

  <rect x="10" y="256" width="280" height="48" rx="6" class="own"/>
  <text x="20" y="275" class="t">own small parts, in the cell package</text>
  <text x="20" y="293" class="s">block fingers, camera adaptor, supports</text>

  <!-- includes -->
  <line x1="290" y1="50"  x2="348" y2="120" class="ln" marker-end="url(#a)"/>
  <line x1="290" y1="106" x2="348" y2="140" class="ln" marker-end="url(#a)"/>
  <line x1="290" y1="162" x2="348" y2="160" class="ln" marker-end="url(#a)"/>
  <line x1="290" y1="218" x2="348" y2="180" class="ln" marker-end="url(#a)"/>
  <line x1="290" y1="280" x2="348" y2="200" class="ln" marker-end="url(#a)"/>
  <text x="318" y="84" class="sc">include</text>

  <!-- Cell description -->
  <rect x="350" y="40" width="300" height="250" rx="8" fill="#FDF6E3" stroke="#0D355F" stroke-width="2"/>
  <text x="500" y="64" class="tc">simple_ur_cell_description</text>
  <text x="500" y="82" class="code" text-anchor="middle">urdf/simple_ur_cell_macro.xacro</text>
  <text x="364" y="110" class="s">1. include vendor and shared macros</text>
  <text x="364" y="132" class="s">2. instantiate them with a tf_prefix</text>
  <text x="364" y="154" class="s">3. connect them with fixed joints:</text>
  <text x="380" y="170" class="code">robot_mount, gripper_mount, ...</text>
  <text x="364" y="192" class="s">4. select variants with xacro args:</text>
  <text x="380" y="208" class="code">gripper_type, enable_cameras</text>
  <text x="364" y="230" class="s">5. the cell is a macro too:</text>
  <text x="380" y="246" class="code">simple_ur_cell(parent, *origin)</text>
  <text x="500" y="276" class="sc" style="font-weight:bold">no ros2_control, no driver, no simulator</text>

  <!-- Consumers -->
  <text x="840" y="16" class="sc">each consumer adds its own ros2_control</text>

  <line x1="650" y1="120" x2="698" y2="64"  class="ln" marker-end="url(#a)"/>
  <line x1="650" y1="165" x2="698" y2="165" class="ln" marker-end="url(#a)"/>
  <line x1="650" y1="210" x2="698" y2="264" class="ln" marker-end="url(#a)"/>

  <rect x="700" y="26" width="290" height="76" rx="6" class="box"/>
  <text x="712" y="45" class="t">simple_ur_cell_bringup</text>
  <text x="712" y="63" class="s">cell + ur_robot_driver's</text>
  <text x="712" y="79" class="code">ur.ros2_control.xacro</text>
  <text x="712" y="94" class="s">real robot or mock hardware</text>

  <rect x="700" y="127" width="290" height="76" rx="6" class="box"/>
  <text x="712" y="146" class="t">simple_ur_cell_moveit_config</text>
  <text x="712" y="164" class="s">cell + mock ros2_control (demo.launch.py)</text>
  <text x="712" y="180" class="s">SRDF: groups, TCP, collision matrix</text>
  <text x="712" y="195" class="s">for the whole cell</text>

  <rect x="700" y="228" width="290" height="76" rx="6" class="ext"/>
  <text x="712" y="247" class="t">simple_ur_cell_gz_sim</text>
  <text x="712" y="265" class="s">separate repository</text>
  <text x="712" y="281" class="s">cell + Gazebo world and</text>
  <text x="712" y="296" class="s">simulation hardware</text>
</svg>
